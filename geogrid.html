<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Controle GEOGRID · Netturbo Esteira</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --accent:#a8c93c;--accent-dark:#6b8a1f;--accent-dim:rgba(168,201,60,.08);
      --bg:#080808;--surface:#111;--surface2:#181818;--surface3:#212121;
      --border:#252525;--border-hi:#353535;
      --text:#e8e8e8;--text-dim:#888;--text-muted:#505050;
      --red:#e53935;--amber:#ffa000;--green:#8bc34a;--purple:#ab47bc;
      --radius:6px;--radius-lg:10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:15px}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:2rem}

    #login-overlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 30%,#0d1a06,#080808);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    .login-box{width:100%;max-width:360px;background:linear-gradient(160deg,#131a10,#0f0f0f);border:1px solid #1a2a12;border-radius:20px;padding:2.2rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
    .login-logo{width:120px;height:auto;object-fit:contain;background:#fff;border-radius:12px;padding:.6rem}
    .login-heading h2{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-align:center}
    .login-heading p{font-size:.63rem;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:.3rem;text-align:center}
    .login-field{width:100%;display:flex;flex-direction:column;gap:.3rem}
    .login-field label{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
    .login-field input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:var(--text);font-size:.92rem;padding:.7rem .9rem;width:100%}
    .login-field input:focus{outline:none;border-color:var(--accent)}
    .login-btn{width:100%;padding:.8rem;background:linear-gradient(135deg,#6b8a1f,#a8c93c);border:none;border-radius:8px;color:#050505;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .login-error{font-size:.75rem;color:var(--red);background:rgba(229,57,53,.08);border:1px solid rgba(229,57,53,.3);border-radius:6px;padding:.5rem .75rem;width:100%;text-align:center;display:none}
    .login-error.visible{display:block}

    .topbar{position:sticky;top:0;z-index:100;height:60px;background:var(--accent);display:flex;align-items:center;gap:.9rem;padding:0 1.1rem;box-shadow:0 2px 12px rgba(0,0,0,.35)}
    .topbar-menu{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0a0a0a;flex-shrink:0}
    .topbar-logo{height:32px;width:auto;background:#fff;border-radius:6px;padding:.2rem .4rem;flex-shrink:0}
    .topbar-brand{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.06em;color:#0a0a0a;text-transform:uppercase;line-height:1.1}
    .topbar-sub{font-size:.58rem;color:#1a2a0e;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
    .topbar-spacer{flex:1}

    .page-actions{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.9rem 1.1rem 0}
    main{max-width:1400px;margin:0 auto;padding:1.3rem 1.1rem 0}

    .btn{padding:.6rem 1.1rem;border:none;border-radius:var(--radius);font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-size:.82rem}
    .btn-accent{background:linear-gradient(135deg,#6b8a1f,#a8c93c);color:#050505}
    .btn-outline{background:transparent;border:1px solid var(--border-hi);color:var(--text-dim)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent)}

    .toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
    .toolbar select{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:.55rem .7rem;min-width:220px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden}
    .card-header{padding:.55rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.5rem}
    .card-header .contagem{background:var(--surface3);border:1px solid var(--border-hi);border-radius:20px;padding:.1rem .55rem;font-size:.68rem;color:var(--text-dim);margin-left:auto}
    .card-body{padding:.9rem 1rem}
    .empty-msg{padding:1.5rem;text-align:center;color:var(--text-muted);font-size:.82rem}

    /* Em tela larga, os itens (protocolo + diagrama de fusão) ficam lado a lado
       em vez de empilhados — o SVG do diagrama já se redimensiona sozinho pra
       largura do wrapper (ver desenharLinhasFusao), então funciona em qualquer
       coluna sem distorcer. */
    #listaPendentes,#listaRecusados,#listaConcluidos{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:.65rem;align-items:start}

    .item-card{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);padding:.75rem .9rem;margin-bottom:.65rem}
    .item-card .protocolo{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--accent);font-size:.9rem}
    .item-card .cliente{font-size:.8rem;margin-top:.1rem}
    .item-card .meta{font-size:.7rem;color:var(--text-muted);margin-top:.4rem;line-height:1.6}
    .item-card .concluido-info{font-size:.72rem;color:var(--green);margin-top:.5rem}
    .item-card .acoes{margin-top:.6rem;display:flex;gap:.5rem;align-items:center}

    .fusao-item-bloco{background:var(--surface2);border:1px solid var(--border-hi);border-radius:8px;padding:.65rem .7rem;margin-top:.5rem}
    .fusao-item-titulo{font-size:.72rem;color:var(--accent);margin-bottom:.5rem;font-weight:600}
    .fusao-item-titulo a{color:var(--accent)}
    .fusao-item-rodape{font-size:.62rem;color:var(--text-dim);margin-top:.4rem}
    .fusao-diagrama{position:relative;display:flex;justify-content:space-between;gap:1.4rem;overflow-x:auto;padding:.3rem 0}
    .fusao-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
    .fusao-coluna{display:flex;flex-direction:column;gap:3px;min-width:100px}
    .fusao-coluna-wrap{display:flex;flex-direction:column}
    .fusao-coluna-titulo{font-size:.6rem;color:var(--text-muted);text-align:center;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em}
    .fibra-row{display:flex;align-items:center;gap:.3rem;padding:.22rem .35rem;border-radius:4px;font-size:.66rem;background:var(--surface3);border:1px solid var(--border-hi);white-space:nowrap;color:var(--text-muted)}
    .fibra-row.pareada{color:var(--text);border-color:#3a3a3a}
    .fibra-row.fibra-splitter-in{border-color:var(--accent);background:rgba(168,201,60,.1)}
    .fibra-num{width:1.3rem;text-align:center;color:var(--text-dim);font-weight:700;flex-shrink:0}
    .fibra-cor-dot{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
    .fibra-anchor{width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
    .fibra-par{font-size:.6rem;color:var(--accent)}
    .fibra-row.armado{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}

    /* ── Edição do diagrama pelo líder (validação antes da sala técnica) ── */
    .edit-label{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:.15rem}
    .edit-field{width:100%;background:var(--bg);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.75rem;padding:.4rem .55rem;font-family:inherit}
    .edit-field:focus{outline:none;border-color:var(--purple)}
    .chip-group{display:flex;flex-wrap:wrap;gap:.4rem}
    .chip{padding:.4rem .75rem;border-radius:20px;border:1px solid var(--border-hi);background:var(--surface3);color:var(--text-dim);font-size:.72rem;font-weight:600;cursor:pointer}
    .chip.active{background:rgba(168,201,60,.15);border-color:var(--accent);color:var(--accent)}

    #toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <img class="login-logo" src="https://netturbo.com.br/wp-content/uploads/2021/04/LOGO-1-768x230.png.webp" alt="Netturbo" onerror="this.style.display='none'"/>
    <div class="login-heading">
      <h2>Controle GEOGRID</h2>
      <p>Sala Técnica</p>
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="pwdInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryLogin()"/>
    </div>
    <div class="login-error" id="loginErro">Senha incorreta.</div>
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
  </div>
</div>

<header class="topbar">
  <div class="topbar-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
  <img class="topbar-logo" src="https://netturbo.com.br/wp-content/uploads/2021/04/LOGO-1-768x230.png.webp" alt="Netturbo" onerror="this.style.display='none'"/>
  <div>
    <div class="topbar-brand">Controle GEOGRID</div>
    <div class="topbar-sub">Sala Técnica</div>
  </div>
  <div class="topbar-spacer"></div>
</header>

<div class="page-actions">
  <a href="painel.html" class="btn btn-outline" style="text-decoration:none;display:inline-flex;align-items:center">Painel</a>
</div>

<main id="app" style="display:none">

  <div class="toolbar">
    <select id="selNome">
      <option value="">Seu nome (pra concluir ou recusar)</option>
    </select>
    <input type="text" id="inputNomeOutro" placeholder="Ou digite seu nome..." style="background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:.55rem .7rem"/>
    <button class="btn btn-outline" onclick="carregarGeogrid()">↻ Atualizar</button>
  </div>

  <div class="card">
    <div class="card-header">Aguardando validação do líder<span class="contagem" id="countValidacaoLider">0</span></div>
    <div class="card-body" id="listaValidacaoLider"></div>
  </div>

  <div class="card">
    <div class="card-header">Pendentes de atualização no GEOGRID<span class="contagem" id="countPendentes">0</span></div>
    <div class="card-body" id="listaPendentes"></div>
  </div>

  <div class="card">
    <div class="card-header">Aguardando ajuste do líder (recusados)<span class="contagem" id="countRecusados">0</span></div>
    <div class="card-body" id="listaRecusados"></div>
  </div>

  <div class="card">
    <div class="card-header" style="cursor:pointer" onclick="toggleConcluidos()">Concluídos (histórico)<span class="contagem" id="countConcluidos">0</span>
      <button class="btn btn-outline" id="btnToggleConcluidos" style="padding:.2rem .55rem;font-size:.72rem;margin-left:.5rem" onclick="event.stopPropagation();toggleConcluidos()">▼</button>
    </div>
    <div class="card-body" id="listaConcluidos" style="display:none"></div>
  </div>

</main>

<div id="toast" style="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--accent-dark);border-radius:30px;padding:.6rem 1.2rem;font-size:.78rem;color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjRSTNLtZs4rUlacLcm_A_lygHYhKbFzPjs02-NCD6f00CVn7zeEDVe96poT7BYtlsVQ/exec";
const LEADERSHIP_PASSWORD = "Manutencao@101";
const NOMES_SALA_TECNICA = ["Pamela Silva","Mariana Cruz","Giselle Silva","Gabriel Resende","Emerson Silva","Gabriel Milhomens","Vinicius Machado","Rubens Lima","Weslley Rodrigues","Leonardo Egídio"];

let TODOS_ITENS = [];

// Mesma paleta/contagem de fibras por tipo de cabo usada em tecnico.html — precisa
// bater exatamente pra o desenho aqui sair igual ao que o técnico preencheu.
const QTD_FIBRAS_POR_CABO = { '01F':1, '04F':4, '12F':12, '24F':24, '72F':72 };
const CORES_FIBRA = ['#00A651','#FFF200','#FFFFFF','#0072BC','#ED1C24','#92278F','#603813','#EC008C','#000000','#A6A6A6','#F7941E','#00AEEF'];
function corFibra(n){ return CORES_FIBRA[(n-1) % 12]; }
const QTD_SPLITTER = { '1x2':2, '1x4':4, '1x8':8, '1x16':16 };

function acharParDe(pareamento, lado, num){
  return pareamento.find(p => (p.ponto1.lado===lado && p.ponto1.num===num) || (p.ponto2.lado===lado && p.ponto2.num===num));
}
function outroPonto(par, lado, num){
  return (par.ponto1.lado===lado && par.ponto1.num===num) ? par.ponto2 : par.ponto1;
}

function tryLogin(){
  const val = document.getElementById('pwdInput').value;
  if(val === LEADERSHIP_PASSWORD){
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('selNome').innerHTML = '<option value="">Seu nome (pra concluir ou recusar)</option>' + NOMES_SALA_TECNICA.map(n=>`<option value="${n}">${n}</option>`).join('');
    carregarGeogrid();
  }else{
    const e = document.getElementById('loginErro');
    e.classList.add('visible');
    document.getElementById('pwdInput').value = '';
    setTimeout(()=>e.classList.remove('visible'), 3000);
  }
}
window.tryLogin = tryLogin;

async function carregarGeogrid(){
  try{
    const resp = await fetch(APPS_SCRIPT_URL + '?acao=LISTAR_GEOGRID');
    const result = await resp.json();
    TODOS_ITENS = result.itens || [];
    renderGeogrid();
  }catch(err){
    console.error(err);
    showToast('Erro ao carregar a fila.');
  }
}
window.carregarGeogrid = carregarGeogrid;

// 'Fusão Pareamento' guarda um item por CEO trabalhada: { numeroCeo, nomenclaturaA,
// nomenclaturaB, tipoCaboA, tipoCaboB, splitter1, splitter1Tipo1x2, splitter2,
// splitter2Tipo1x2, pares:[{ponto1:{lado,num},ponto2:{lado,num}}] } — uma linha
// de resumo por CEO (cada CEO pode ter um cabo diferente), pra sala técnica saber
// exatamente qual caixa cada mapeamento de fibra (ou porta de splitter) se refere.
// Cabo A, Splitter 1, Splitter 2 e Cabo B formam uma cadeia (nessa ordem), todos
// opcionais — mesmo modelo do editor em tecnico.html. Porta 0 de cada splitter é
// sempre "IN" (recebe a fibra da coluna anterior); 1..N são as saídas pra próxima.
function rotuloPontoGeogrid(ponto){
  if(ponto.lado==='splitter1') return ponto.num===0 ? 'Splitter 1 IN' : 'Splitter 1 P'+ponto.num;
  if(ponto.lado==='splitter2') return ponto.num===0 ? 'Splitter 2 IN' : 'Splitter 2 P'+ponto.num;
  return (ponto.lado==='a'?'A':'B') + ponto.num;
}
function colunasFusaoGeogrid(d){
  const cols = [];
  if(d.tipoCaboA) cols.push('a');
  if(d.splitter1) cols.push('splitter1');
  if(d.splitter2) cols.push('splitter2');
  if(d.tipoCaboB) cols.push('b');
  return cols;
}
// Itens registrados antes da cascata de splitters vinham num formato mais simples
// (splitter/splitterTipo1x2 único, pares com lado:'splitter') — normaliza pro
// formato atual (splitter1/splitter2) pra desenhar certo mesmo o que já está
// registrado na planilha de produção.
function normalizarDiagramaFusaoGeogrid(d){
  const remapLado = l => l === 'splitter' ? 'splitter1' : l;
  return {
    numeroCeo: d.numeroCeo, nomenclaturaA: d.nomenclaturaA, nomenclaturaB: d.nomenclaturaB, gpsCeo: d.gpsCeo,
    tipoCaboA: d.tipoCaboA, tipoCaboB: d.tipoCaboB,
    splitter1: d.splitter1 || d.splitter || '', splitter1Tipo1x2: d.splitter1Tipo1x2 || d.splitterTipo1x2 || '',
    splitter2: d.splitter2 || '', splitter2Tipo1x2: d.splitter2Tipo1x2 || '',
    pares: (Array.isArray(d.pares) ? d.pares : []).map(p => ({
      ponto1:{lado:remapLado(p.ponto1.lado),num:p.ponto1.num}, ponto2:{lado:remapLado(p.ponto2.lado),num:p.ponto2.num}
    }))
  };
}
function diagramasFusao(item){
  if(!item['Fusão Pareamento']) return [];
  try{
    const diagramas = JSON.parse(item['Fusão Pareamento']);
    if(!Array.isArray(diagramas)) return [];
    return diagramas.map(normalizarDiagramaFusaoGeogrid).filter(d => d.pares.length);
  }catch(e){ return []; }
}

// Desenho igual ao que o técnico viu em tecnico.html (mesmas cores, mesmas colunas
// Lado A / Splitter 1 / Splitter 2 / Lado B) — só que sem clique, é read-only pra sala técnica.
function renderDiagramaFusaoGeogrid(rowIndex, diagIdx, d){
  const cols = colunasFusaoGeogrid(d);
  if(cols.length < 2) return '';
  const pareamento = d.pares;

  const tituloColuna = lado => {
    if(lado === 'a') return 'Lado A · ' + d.tipoCaboA;
    if(lado === 'b') return 'Lado B · ' + d.tipoCaboB;
    const num = lado === 'splitter1' ? '1' : '2';
    const valor = lado === 'splitter1' ? d.splitter1 : d.splitter2;
    const tipo1x2 = lado === 'splitter1' ? d.splitter1Tipo1x2 : d.splitter2Tipo1x2;
    return 'Splitter ' + num + ' · ' + valor + (tipo1x2 ? ' (' + tipo1x2 + ')' : '');
  };
  const portasDe = lado => {
    if(lado === 'a') return Array.from({length: QTD_FIBRAS_POR_CABO[d.tipoCaboA] || 0}, (_,i)=>i+1);
    if(lado === 'b') return Array.from({length: QTD_FIBRAS_POR_CABO[d.tipoCaboB] || 0}, (_,i)=>i+1);
    const n = QTD_SPLITTER[lado === 'splitter1' ? d.splitter1 : d.splitter2] || 0;
    return n ? Array.from({length: n+1}, (_,i)=>i) : [];
  };
  const linhaPorto = (lado, num) => {
    const ehSplitter = lado === 'splitter1' || lado === 'splitter2';
    const ehIn = ehSplitter && num === 0;
    const par = acharParDe(pareamento, lado, num);
    return `<div class="fibra-row${par?' pareada':''}${ehIn?' fibra-splitter-in':''}">
      <span class="fibra-num"${ehSplitter?' style="width:auto;padding:0 .2rem"':''}>${ehSplitter ? (ehIn?'IN':'P'+num) : num}</span>
      ${ehSplitter ? '' : `<span class="fibra-cor-dot" style="background:${corFibra(num)}"></span>`}
      ${par ? `<span class="fibra-par">${rotuloPontoGeogrid(outroPonto(par,lado,num))}</span>` : ''}
      <span class="fibra-anchor" id="fibra-geo-${lado}-${rowIndex}-${diagIdx}-${num}"></span>
    </div>`;
  };

  return `
    <div class="fusao-diagrama" id="fusao-diagrama-geo-${rowIndex}-${diagIdx}">
      <svg class="fusao-svg" id="fusao-svg-geo-${rowIndex}-${diagIdx}"></svg>
      ${cols.map(lado => `<div class="fusao-coluna-wrap">
        <div class="fusao-coluna-titulo">${tituloColuna(lado)}</div>
        <div class="fusao-coluna${lado.indexOf('splitter')===0?' fusao-coluna-splitter':''}">${portasDe(lado).map(num=>linhaPorto(lado,num)).join('')}</div>
      </div>`).join('')}
    </div>
  `;
}

function blocoDiagramasFusao(item){
  const diagramas = diagramasFusao(item);
  if(!diagramas.length) return '';
  return diagramas.map((d,i) => {
    const gps = d.gpsCeo || '';
    const infoGps = gps ? (gps.startsWith('http') ? ` · <a href="${gps}" target="_blank" rel="noopener">Local no mapa</a>` : ` · Local: ${gps}`) : '';
    return `<div class="fusao-item-bloco">
      <div class="fusao-item-titulo">CEO Nº${d.numeroCeo||'?'} · ${d.nomenclaturaA||'?'} → ${d.nomenclaturaB||'?'}${infoGps}</div>
      ${renderDiagramaFusaoGeogrid(item.rowIndex, i, d)}
      <div class="fusao-item-rodape">${d.pares.length} ligação(ões)</div>
    </div>`;
  }).join('');
}

// Mede as bolinhas âncora depois do innerHTML aplicado e desenha as linhas SVG —
// precisa rodar depois do render, senão getBoundingClientRect pega posição zerada.
function desenharLinhasFusaoGeogrid(rowIndex, diagIdx, d){
  const svg = document.getElementById(`fusao-svg-geo-${rowIndex}-${diagIdx}`);
  const wrap = document.getElementById(`fusao-diagrama-geo-${rowIndex}-${diagIdx}`);
  if(!svg || !wrap) return;
  const pareamento = Array.isArray(d.pares) ? d.pares : [];
  const wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width);
  svg.setAttribute('height', wrapRect.height);
  svg.innerHTML = pareamento.map(p=>{
    const el1 = document.getElementById(`fibra-geo-${p.ponto1.lado}-${rowIndex}-${diagIdx}-${p.ponto1.num}`);
    const el2 = document.getElementById(`fibra-geo-${p.ponto2.lado}-${rowIndex}-${diagIdx}-${p.ponto2.num}`);
    if(!el1 || !el2) return '';
    const r1 = el1.getBoundingClientRect(), r2 = el2.getBoundingClientRect();
    const x1 = r1.left - wrapRect.left + r1.width/2, y1 = r1.top - wrapRect.top + r1.height/2;
    const x2 = r2.left - wrapRect.left + r2.width/2, y2 = r2.top - wrapRect.top + r2.height/2;
    const ehCabo = pt => pt.lado === 'a' || pt.lado === 'b';
    const ptCor = ehCabo(p.ponto1) ? p.ponto1 : (ehCabo(p.ponto2) ? p.ponto2 : p.ponto1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${corFibra(ptCor.num)}" stroke-width="2"/>`;
  }).join('');
}

// ── VALIDAÇÃO DO LÍDER (nova etapa, antes da sala técnica ver o item) ──────
// Item nasce com Status='AGUARDANDO_VALIDACAO_LIDER' (ver registrarGeogridSeNecessario
// no backend) — só vira 'PENDENTE' (visível pra sala técnica) depois que o líder aprova
// aqui, com ou sem correção. Reaproveita o editor visual (Lado A — Splitter 1 —
// Splitter 2 — Lado B) já usado em index.html pra "Fusões Recusadas pelo GEOGRID",
// portado pra dentro do próprio geogrid.html (mesma senha/login da sala técnica) —
// e as funções puras já existentes neste arquivo (QTD_FIBRAS_POR_CABO, CORES_FIBRA,
// corFibra, QTD_SPLITTER, acharParDe, outroPonto, colunasFusaoGeogrid,
// rotuloPontoGeogrid). Ids com prefixo "lider-" pra não colidir com os da visão
// somente-leitura ("fusao-svg-geo-"/"fibra-geo-") usada nas outras 3 listas.
const OPCOES_SPLITTER = ['Nenhum','1x2','1x4','1x8','1x16'];
const OPCOES_CABO = ['Nenhum','01F','04F','12F','24F','72F'];
const OPCOES_SPLITTER_1X2 = ['5/95','10/90','15/85','20/80','25/75','30/70','40/60','50/50'];

let GEOGRID_LIDER_EDIT_STATE = {}; // rowIndex -> { diagramas:[...] } — só existe pros itens que o líder abriu "Editar"
let ITENS_EM_EDICAO_LIDER = new Set(); // rowIndex dos itens no modo edição (troca read-only <-> formulário)

function colunasVizinhasLider(d, ladoX, ladoY){
  const cols = colunasFusaoGeogrid(d);
  const ix = cols.indexOf(ladoX), iy = cols.indexOf(ladoY);
  return ix !== -1 && iy !== -1 && Math.abs(ix-iy) === 1;
}

function novoDiagramaFusaoEdicaoLider(numeroCeo){
  return { numeroCeo: String(numeroCeo), nomA:'', nomB:'', gpsCeo:'', tipoCaboA:'', tipoCaboB:'',
    splitter1:'', splitter1Tipo1x2:'', splitter2:'', splitter2Tipo1x2:'', pareamento:[], armado:null };
}

function normalizarDiagramaFusaoEdicaoLider(d, i){
  const bruto = d || {};
  const remapLado = l => l === 'splitter' ? 'splitter1' : l;
  const pares = (Array.isArray(bruto.pares) ? bruto.pares : []).map(p=>{
    if(!p || !p.ponto1 || !p.ponto2) return null;
    return { ponto1:{lado:remapLado(p.ponto1.lado),num:p.ponto1.num}, ponto2:{lado:remapLado(p.ponto2.lado),num:p.ponto2.num} };
  }).filter(Boolean);
  return {
    numeroCeo: bruto.numeroCeo || String(i+1),
    nomA: bruto.nomenclaturaA || '', nomB: bruto.nomenclaturaB || '', gpsCeo: bruto.gpsCeo || '',
    tipoCaboA: bruto.tipoCaboA || '', tipoCaboB: bruto.tipoCaboB || '',
    splitter1: bruto.splitter1 || bruto.splitter || '', splitter1Tipo1x2: bruto.splitter1Tipo1x2 || bruto.splitterTipo1x2 || '',
    splitter2: bruto.splitter2 || '', splitter2Tipo1x2: bruto.splitter2Tipo1x2 || '',
    armado: null, pareamento: pares
  };
}

function inicializarEdicaoLider(item){
  if(GEOGRID_LIDER_EDIT_STATE[item.rowIndex]) return GEOGRID_LIDER_EDIT_STATE[item.rowIndex];
  let diagramas = [];
  try{
    const parsed = JSON.parse(item['Fusão Pareamento'] || '[]');
    if(Array.isArray(parsed)) diagramas = parsed.map((d,i)=>normalizarDiagramaFusaoEdicaoLider(d,i));
  }catch(e){ diagramas = []; }
  if(!diagramas.length) diagramas = [novoDiagramaFusaoEdicaoLider(1)];
  GEOGRID_LIDER_EDIT_STATE[item.rowIndex] = { diagramas };
  return GEOGRID_LIDER_EDIT_STATE[item.rowIndex];
}

function renderEdicaoDiagramasLider(item){
  const st = inicializarEdicaoLider(item);
  return `
    <div id="lider-diagramas-lista-${item.rowIndex}">${st.diagramas.map((d,i)=>renderEdicaoDiagramaBlocoLider(item.rowIndex,i)).join('')}</div>
    <button type="button" class="btn btn-outline" style="margin-top:.5rem;padding:.35rem .7rem;font-size:.7rem" onclick="adicionarDiagramaEdicaoLider(${item.rowIndex})">+ Adicionar CEO</button>
  `;
}

window.adicionarDiagramaEdicaoLider = function(rowIndex){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  if(!st) return;
  st.diagramas.push(novoDiagramaFusaoEdicaoLider(st.diagramas.length+1));
  const lista = document.getElementById('lider-diagramas-lista-'+rowIndex);
  const idx = st.diagramas.length-1;
  if(lista){
    lista.insertAdjacentHTML('beforeend', renderEdicaoDiagramaBlocoLider(rowIndex, idx));
    requestAnimationFrame(()=>desenharLinhasFusaoEdicaoLider(rowIndex, idx));
  }
};

window.removerDiagramaEdicaoLider = function(rowIndex, diagIdx){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  if(!st || st.diagramas.length <= 1) return;
  st.diagramas.splice(diagIdx, 1);
  const lista = document.getElementById('lider-diagramas-lista-'+rowIndex);
  if(lista){
    lista.innerHTML = st.diagramas.map((d,i)=>renderEdicaoDiagramaBlocoLider(rowIndex,i)).join('');
    requestAnimationFrame(()=>st.diagramas.forEach((d,i)=>desenharLinhasFusaoEdicaoLider(rowIndex,i)));
  }
};

window.atualizarCampoEdicaoLider = function(rowIndex, diagIdx, campo, valor){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  if(!st || !st.diagramas[diagIdx]) return;
  st.diagramas[diagIdx][campo] = valor;
};

function renderEdicaoDiagramaBlocoLider(rowIndex, diagIdx){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st.diagramas[diagIdx];
  const podeRemover = st.diagramas.length > 1;
  return `
    <div class="fusao-diagrama-bloco" id="lider-diagrama-bloco-${rowIndex}-${diagIdx}" style="border:1px solid var(--border-hi);border-radius:var(--radius);padding:.6rem .7rem;margin-top:${diagIdx>0?'.6rem':'0'}">
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="edit-label" style="margin-bottom:0">Fusão — CEO Nº</span>
        <input type="text" inputmode="text" class="edit-field" style="max-width:70px" value="${d.numeroCeo||''}" oninput="this.value=this.value.replace(/[^0-9A-Za-z]/g,'');atualizarCampoEdicaoLider(${rowIndex},${diagIdx},'numeroCeo',this.value)"/>
        ${podeRemover ? `<button type="button" style="margin-left:auto;background:transparent;border:1px solid rgba(229,57,53,.3);color:#e57373;border-radius:var(--radius);font-size:.65rem;padding:.35rem .6rem;cursor:pointer" onclick="removerDiagramaEdicaoLider(${rowIndex},${diagIdx})">Remover</button>` : ''}
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <div style="flex:1">
          <span class="edit-label">Tipo de cabo — Lado A</span>
          <div class="chip-group">
            ${OPCOES_CABO.map(c=>`<div class="chip${(d.tipoCaboA||'Nenhum')===c?' active':''}" onclick="atualizarTipoCaboEdicaoLider(${rowIndex},${diagIdx},'A','${c}')">${c}</div>`).join('')}
          </div>
          ${d.tipoCaboA ? `<span class="edit-label" style="margin-top:.5rem">Nomenclatura — Lado A</span>
          <input type="text" class="edit-field" value="${d.nomA||''}" oninput="atualizarCampoEdicaoLider(${rowIndex},${diagIdx},'nomA',this.value)"/>` : ''}
        </div>
        <div style="flex:1">
          <span class="edit-label">Tipo de cabo — Lado B</span>
          <div class="chip-group">
            ${OPCOES_CABO.map(c=>`<div class="chip${(d.tipoCaboB||'Nenhum')===c?' active':''}" onclick="atualizarTipoCaboEdicaoLider(${rowIndex},${diagIdx},'B','${c}')">${c}</div>`).join('')}
          </div>
          ${d.tipoCaboB ? `<span class="edit-label" style="margin-top:.5rem">Nomenclatura — Lado B</span>
          <input type="text" class="edit-field" value="${d.nomB||''}" oninput="atualizarCampoEdicaoLider(${rowIndex},${diagIdx},'nomB',this.value)"/>` : ''}
        </div>
      </div>
      <div style="margin-top:.5rem">
        <span class="edit-label">Splitter 1</span>
        <div class="chip-group">
          ${OPCOES_SPLITTER.map(s=>`<div class="chip${(d.splitter1||'Nenhum')===s?' active':''}" onclick="atualizarSplitterEdicaoLider(${rowIndex},${diagIdx},'1','${s}')">${s}</div>`).join('')}
        </div>
      </div>
      ${d.splitter1 === '1x2' ? `
      <div style="margin-top:.5rem">
        <span class="edit-label">Splitter 1 tipo</span>
        <div class="chip-group">
          ${OPCOES_SPLITTER_1X2.map(t=>`<div class="chip${d.splitter1Tipo1x2===t?' active':''}" onclick="atualizarSplitterTipo1x2EdicaoLider(${rowIndex},${diagIdx},'1','${t}')">${t}</div>`).join('')}
        </div>
      </div>` : ''}
      ${d.splitter1 ? `
      <div style="margin-top:.5rem">
        <span class="edit-label">Splitter 2 (cascata com o Splitter 1)</span>
        <div class="chip-group">
          ${OPCOES_SPLITTER.map(s=>`<div class="chip${(d.splitter2||'Nenhum')===s?' active':''}" onclick="atualizarSplitterEdicaoLider(${rowIndex},${diagIdx},'2','${s}')">${s}</div>`).join('')}
        </div>
      </div>
      ${d.splitter2 === '1x2' ? `
      <div style="margin-top:.5rem">
        <span class="edit-label">Splitter 2 tipo</span>
        <div class="chip-group">
          ${OPCOES_SPLITTER_1X2.map(t=>`<div class="chip${d.splitter2Tipo1x2===t?' active':''}" onclick="atualizarSplitterTipo1x2EdicaoLider(${rowIndex},${diagIdx},'2','${t}')">${t}</div>`).join('')}
        </div>
      </div>` : ''}` : ''}
      <div id="lider-fibras-${rowIndex}-${diagIdx}" style="margin-top:.5rem">${renderFibrasEdicaoLider(rowIndex, diagIdx)}</div>
    </div>`;
}

window.atualizarTipoCaboEdicaoLider = function(rowIndex, diagIdx, lado, valor){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st && st.diagramas[diagIdx];
  if(!d) return;
  const campo = lado === 'A' ? 'tipoCaboA' : 'tipoCaboB';
  const ladoKey = lado === 'A' ? 'a' : 'b';
  const novoValor = valor === 'Nenhum' ? '' : valor;
  if(novoValor !== d[campo]){
    d.pareamento = d.pareamento.filter(p => p.ponto1.lado !== ladoKey && p.ponto2.lado !== ladoKey);
    if(d.armado && d.armado.lado === ladoKey) d.armado = null;
  }
  d[campo] = novoValor;
  const bloco = document.getElementById(`lider-diagrama-bloco-${rowIndex}-${diagIdx}`);
  if(bloco) bloco.outerHTML = renderEdicaoDiagramaBlocoLider(rowIndex, diagIdx);
  requestAnimationFrame(()=>desenharLinhasFusaoEdicaoLider(rowIndex, diagIdx));
};

window.atualizarSplitterEdicaoLider = function(rowIndex, diagIdx, qual, valor){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st && st.diagramas[diagIdx];
  if(!d) return;
  const campo = 'splitter'+qual, campoTipo = 'splitter'+qual+'Tipo1x2', ladoKey = 'splitter'+qual;
  const novoValor = valor === 'Nenhum' ? '' : valor;
  if(novoValor !== d[campo]){
    d.pareamento = d.pareamento.filter(p => p.ponto1.lado !== ladoKey && p.ponto2.lado !== ladoKey);
    if(d.armado && d.armado.lado === ladoKey) d.armado = null;
    if(novoValor !== '1x2') d[campoTipo] = '';
  }
  d[campo] = novoValor;
  if(qual === '1' && !novoValor && d.splitter2){
    d.pareamento = d.pareamento.filter(p => p.ponto1.lado !== 'splitter2' && p.ponto2.lado !== 'splitter2');
    if(d.armado && d.armado.lado === 'splitter2') d.armado = null;
    d.splitter2 = '';
    d.splitter2Tipo1x2 = '';
  }
  const bloco = document.getElementById(`lider-diagrama-bloco-${rowIndex}-${diagIdx}`);
  if(bloco) bloco.outerHTML = renderEdicaoDiagramaBlocoLider(rowIndex, diagIdx);
  requestAnimationFrame(()=>desenharLinhasFusaoEdicaoLider(rowIndex, diagIdx));
};

window.atualizarSplitterTipo1x2EdicaoLider = function(rowIndex, diagIdx, qual, valor){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st && st.diagramas[diagIdx];
  if(!d) return;
  d['splitter'+qual+'Tipo1x2'] = valor;
  const bloco = document.getElementById(`lider-diagrama-bloco-${rowIndex}-${diagIdx}`);
  if(bloco) bloco.outerHTML = renderEdicaoDiagramaBlocoLider(rowIndex, diagIdx);
};

function renderFibrasEdicaoLider(rowIndex, diagIdx){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st.diagramas[diagIdx];
  const cols = colunasFusaoGeogrid(d);
  if(cols.length < 2){
    return `<div style="font-size:.68rem;color:var(--text-muted);font-style:italic">Escolha pelo menos duas partes (cabo A, splitter 1, splitter 2 ou cabo B) para abrir o diagrama.</div>`;
  }
  const tituloColuna = lado => {
    if(lado === 'a') return 'Lado A · ' + d.tipoCaboA;
    if(lado === 'b') return 'Lado B · ' + d.tipoCaboB;
    const num = lado === 'splitter1' ? '1' : '2';
    const valor = lado === 'splitter1' ? d.splitter1 : d.splitter2;
    const tipo1x2 = lado === 'splitter1' ? d.splitter1Tipo1x2 : d.splitter2Tipo1x2;
    return 'Splitter ' + num + ' · ' + valor + (tipo1x2 ? ' (' + tipo1x2 + ')' : '');
  };
  const portasDe = lado => {
    if(lado === 'a') return Array.from({length: QTD_FIBRAS_POR_CABO[d.tipoCaboA] || 0}, (_,i)=>i+1);
    if(lado === 'b') return Array.from({length: QTD_FIBRAS_POR_CABO[d.tipoCaboB] || 0}, (_,i)=>i+1);
    const n = QTD_SPLITTER[lado === 'splitter1' ? d.splitter1 : d.splitter2] || 0;
    return n ? Array.from({length: n+1}, (_,i)=>i) : [];
  };
  const linhaPorto = (lado, num) => {
    const ehSplitter = lado === 'splitter1' || lado === 'splitter2';
    const ehIn = ehSplitter && num === 0;
    const armado = d.armado && d.armado.lado===lado && d.armado.num===num;
    const par = acharParDe(d.pareamento, lado, num);
    return `<div class="fibra-row${armado?' armado':''}${par?' pareada':''}${ehIn?' fibra-splitter-in':''}" onclick="clicarFibraEdicaoLider(${rowIndex},${diagIdx},'${lado}',${num})">
      <span class="fibra-num"${ehSplitter?' style="width:auto;padding:0 .2rem"':''}>${ehSplitter ? (ehIn?'IN':'P'+num) : num}</span>
      ${ehSplitter ? '' : `<span class="fibra-cor-dot" style="background:${corFibra(num)}"></span>`}
      ${par ? `<span class="fibra-par">${rotuloPontoGeogrid(outroPonto(par,lado,num))}</span>` : ''}
      <span class="fibra-anchor" id="lider-fibra-${lado}-${rowIndex}-${diagIdx}-${num}"></span>
    </div>`;
  };
  return `
    <div style="font-size:.64rem;color:var(--text-muted);margin-bottom:.4rem">Toque num ponto e depois num ponto da coluna VIZINHA pra ligar. Toque num ponto já ligado pra desfazer.</div>
    <div class="fusao-diagrama" id="lider-diagrama-${rowIndex}-${diagIdx}">
      <svg class="fusao-svg" id="lider-svg-${rowIndex}-${diagIdx}"></svg>
      ${cols.map(lado => `<div class="fusao-coluna-wrap">
        <div class="fusao-coluna-titulo">${tituloColuna(lado)}</div>
        <div class="fusao-coluna${lado.indexOf('splitter')===0?' fusao-coluna-splitter':''}">${portasDe(lado).map(num=>linhaPorto(lado,num)).join('')}</div>
      </div>`).join('')}
    </div>
    <div style="font-size:.64rem;color:var(--text-dim);margin-top:.4rem">${d.pareamento.length} ligação(ões)</div>
  `;
}

window.clicarFibraEdicaoLider = function(rowIndex, diagIdx, lado, num){
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st && st.diagramas[diagIdx];
  if(!d) return;
  const parExistente = acharParDe(d.pareamento, lado, num);
  if(parExistente){
    d.pareamento.splice(d.pareamento.indexOf(parExistente), 1);
    d.armado = null;
  } else if(d.armado && d.armado.lado === lado && d.armado.num === num){
    d.armado = null;
  } else if(d.armado && !colunasVizinhasLider(d, d.armado.lado, lado)){
    showToast('Só dá pra ligar colunas vizinhas.');
    d.armado = { lado, num };
  } else if(d.armado){
    d.pareamento.push({ ponto1: d.armado, ponto2: { lado, num } });
    d.armado = null;
  } else {
    d.armado = { lado, num };
  }
  const fibrasEl = document.getElementById(`lider-fibras-${rowIndex}-${diagIdx}`);
  if(fibrasEl) fibrasEl.innerHTML = renderFibrasEdicaoLider(rowIndex, diagIdx);
  requestAnimationFrame(()=>desenharLinhasFusaoEdicaoLider(rowIndex, diagIdx));
};

function desenharLinhasFusaoEdicaoLider(rowIndex, diagIdx){
  const svg = document.getElementById(`lider-svg-${rowIndex}-${diagIdx}`);
  const wrap = document.getElementById(`lider-diagrama-${rowIndex}-${diagIdx}`);
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  const d = st && st.diagramas[diagIdx];
  if(!svg || !wrap || !d) return;
  const wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width);
  svg.setAttribute('height', wrapRect.height);
  svg.innerHTML = d.pareamento.map(p=>{
    const el1 = document.getElementById(`lider-fibra-${p.ponto1.lado}-${rowIndex}-${diagIdx}-${p.ponto1.num}`);
    const el2 = document.getElementById(`lider-fibra-${p.ponto2.lado}-${rowIndex}-${diagIdx}-${p.ponto2.num}`);
    if(!el1 || !el2) return '';
    const r1 = el1.getBoundingClientRect(), r2 = el2.getBoundingClientRect();
    const x1 = r1.left - wrapRect.left + r1.width/2, y1 = r1.top - wrapRect.top + r1.height/2;
    const x2 = r2.left - wrapRect.left + r2.width/2, y2 = r2.top - wrapRect.top + r2.height/2;
    const ehCabo = pt => pt.lado === 'a' || pt.lado === 'b';
    const ptCor = ehCabo(p.ponto1) ? p.ponto1 : (ehCabo(p.ponto2) ? p.ponto2 : p.ponto1);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${corFibra(ptCor.num)}" stroke-width="2"/>`;
  }).join('');
}

window.toggleEdicaoLider = function(rowIndex){
  if(ITENS_EM_EDICAO_LIDER.has(rowIndex)){
    ITENS_EM_EDICAO_LIDER.delete(rowIndex);
    delete GEOGRID_LIDER_EDIT_STATE[rowIndex];
  }else{
    ITENS_EM_EDICAO_LIDER.add(rowIndex);
  }
  renderValidacaoLider();
};

window.aprovarValidacaoLider = async function(rowIndex){
  const nome = (document.getElementById('inputNomeOutro').value.trim()) || document.getElementById('selNome').value;
  if(!nome){ showToast('Informe quem está aprovando antes.'); return; }

  const payload = { acao:'APROVAR_GEOGRID_LIDER', rowIndex, aprovadoPor: nome };
  const st = GEOGRID_LIDER_EDIT_STATE[rowIndex];
  if(st){
    // Líder abriu "Editar" — envia o estado atual (mesmo formato de reenviarGeogrid).
    const diagramasRelevantes = st.diagramas.filter(d => d.pareamento.length > 0 || d.tipoCaboA || d.tipoCaboB || d.nomA || d.nomB || d.splitter1);
    if(!diagramasRelevantes.length){ showToast('Desenhe pelo menos uma ligação antes de aprovar (ou cancele a edição).'); return; }
    const diagramasSerializados = diagramasRelevantes.map(d => ({
      numeroCeo: d.numeroCeo, nomenclaturaA: d.nomA, nomenclaturaB: d.nomB, gpsCeo: d.gpsCeo,
      tipoCaboA: d.tipoCaboA, tipoCaboB: d.tipoCaboB,
      splitter1: d.splitter1, splitter1Tipo1x2: d.splitter1Tipo1x2,
      splitter2: d.splitter2, splitter2Tipo1x2: d.splitter2Tipo1x2,
      pares: d.pareamento
    }));
    payload.fusaoPareamento = JSON.stringify(diagramasSerializados);
    payload.tipoCaboFusionado = [...new Set(diagramasRelevantes.flatMap(d=>[d.tipoCaboA,d.tipoCaboB]).filter(Boolean))].join(', ');
    payload.quantidadeCeo = String(diagramasRelevantes.length);
  }

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao aprovar.'); return; }
    delete GEOGRID_LIDER_EDIT_STATE[rowIndex];
    ITENS_EM_EDICAO_LIDER.delete(rowIndex);
    showToast('Aprovado — segue pra sala técnica!');
    carregarGeogrid();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

window.excluirValidacaoLider = async function(rowIndex){
  if(!confirm('Excluir esta fusão de vez, antes mesmo de ir pra sala técnica? Não dá pra desfazer.')) return;
  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'EXCLUIR_GEOGRID', rowIndex })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao excluir.'); return; }
    delete GEOGRID_LIDER_EDIT_STATE[rowIndex];
    ITENS_EM_EDICAO_LIDER.delete(rowIndex);
    showToast('Excluído.');
    carregarGeogrid();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

function renderValidacaoLider(){
  const itens = TODOS_ITENS.filter(i => i['Status'] === 'AGUARDANDO_VALIDACAO_LIDER');
  document.getElementById('countValidacaoLider').textContent = itens.length;
  const el = document.getElementById('listaValidacaoLider');
  el.innerHTML = itens.length ? itens.map(item => {
    const emEdicao = ITENS_EM_EDICAO_LIDER.has(item.rowIndex);
    const corpo = emEdicao
      ? `<div id="lider-edicao-${item.rowIndex}" style="margin-top:.6rem">${renderEdicaoDiagramasLider(item)}</div>`
      : blocoDiagramasFusao(item);
    return `
    <div class="item-card">
      <div class="protocolo">${item['Protocolo']||'—'}</div>
      <div class="cliente">${item['Cliente']||'—'}</div>
      <div class="meta">${item['Técnico'] ? 'Técnico: '+item['Técnico']+'<br>' : ''}${item['Endereço']||''}<br>Fusionou todas: ${item['Fusionou Todas']||'—'} · Qtd. CEO trabalhadas: ${item['Quantidade CEO Trabalhadas']||'—'}<br>Registrado em ${item['Timestamp Registro']||'—'}</div>
      ${corpo}
      <div class="acoes">
        <button class="btn btn-accent" style="padding:.45rem .8rem;font-size:.75rem" onclick="aprovarValidacaoLider(${item.rowIndex})">Aprovar</button>
        <button class="btn btn-outline" style="padding:.45rem .8rem;font-size:.75rem" onclick="toggleEdicaoLider(${item.rowIndex})">${emEdicao?'Cancelar edição':'Editar'}</button>
        <button class="btn" style="padding:.45rem .8rem;font-size:.75rem;background:transparent;border:1px solid rgba(229,57,53,.35);color:#e57373" onclick="excluirValidacaoLider(${item.rowIndex})">Excluir</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-msg">Nenhuma fusão aguardando validação do líder.</div>';

  requestAnimationFrame(() => {
    itens.forEach(item => {
      if(ITENS_EM_EDICAO_LIDER.has(item.rowIndex)){
        const st = GEOGRID_LIDER_EDIT_STATE[item.rowIndex];
        if(st) st.diagramas.forEach((d,i)=>desenharLinhasFusaoEdicaoLider(item.rowIndex, i));
      }else{
        diagramasFusao(item).forEach((d, i) => desenharLinhasFusaoGeogrid(item.rowIndex, i, d));
      }
    });
  });
}

function renderGeogrid(){
  renderValidacaoLider();
  const pendentes = TODOS_ITENS.filter(i => i['Status'] === 'PENDENTE');
  const recusados = TODOS_ITENS.filter(i => i['Status'] === 'RECUSADO');
  const concluidos = TODOS_ITENS.filter(i => i['Status'] === 'CONCLUIDO')
    .sort((a,b) => String(b['Timestamp Conclusão']||'').localeCompare(String(a['Timestamp Conclusão']||'')));

  document.getElementById('countPendentes').textContent = pendentes.length;
  document.getElementById('countRecusados').textContent = recusados.length;
  document.getElementById('countConcluidos').textContent = concluidos.length;

  const infoTecnico = item => item['Técnico'] ? `Técnico: ${item['Técnico']}<br>` : '';

  const elP = document.getElementById('listaPendentes');
  elP.innerHTML = pendentes.length ? pendentes.map(item => `
    <div class="item-card">
      <div class="protocolo">${item['Protocolo']||'—'}</div>
      <div class="cliente">${item['Cliente']||'—'}</div>
      <div class="meta">${infoTecnico(item)}${item['Endereço']||''}<br>Fusionou todas: ${item['Fusionou Todas']||'—'} · Qtd. CEO trabalhadas: ${item['Quantidade CEO Trabalhadas']||'—'}<br>Registrado em ${item['Timestamp Registro']||'—'}</div>
      ${blocoDiagramasFusao(item)}
      <div id="recusa-form-${item.rowIndex}" style="display:none;margin-top:.6rem">
        <textarea id="recusa-motivo-${item.rowIndex}" placeholder="Por que está recusando? (obrigatório)" style="width:100%;min-height:60px;background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.8rem;padding:.5rem .6rem;font-family:inherit"></textarea>
      </div>
      <div class="acoes">
        <button class="btn btn-accent" style="padding:.45rem .8rem;font-size:.75rem" onclick="concluir(${item.rowIndex})">Marcar como concluído no GEOGRID</button>
        <button class="btn btn-outline" style="padding:.45rem .8rem;font-size:.75rem;border-color:rgba(229,57,53,.35);color:#e57373" onclick="toggleRecusarForm(${item.rowIndex})">Recusar</button>
        <button class="btn btn-accent" style="padding:.45rem .8rem;font-size:.75rem;display:none" id="recusa-confirmar-${item.rowIndex}" onclick="recusar(${item.rowIndex})">Confirmar recusa</button>
      </div>
    </div>`).join('') : '<div class="empty-msg">Nenhuma fusão pendente.</div>';

  const elR = document.getElementById('listaRecusados');
  elR.innerHTML = recusados.length ? recusados.map(item => `
    <div class="item-card">
      <div class="protocolo">${item['Protocolo']||'—'}</div>
      <div class="cliente">${item['Cliente']||'—'}</div>
      <div class="meta">${infoTecnico(item)}${item['Endereço']||''}</div>
      ${blocoDiagramasFusao(item)}
      <div class="meta" style="color:var(--red);margin-top:.5rem">Motivo da recusa (${item['Recusado Por']||'—'}, ${item['Timestamp Recusa']||'—'}): ${item['Motivo Recusa']||'—'}</div>
      <div class="meta" style="margin-top:.3rem">Aguardando o líder ajustar na Esteira de Despacho e reenviar.</div>
    </div>`).join('') : '<div class="empty-msg">Nenhum item aguardando ajuste do líder.</div>';

  const elC = document.getElementById('listaConcluidos');
  elC.innerHTML = concluidos.length ? concluidos.map(item => `
    <div class="item-card">
      <div class="protocolo">${item['Protocolo']||'—'}</div>
      <div class="cliente">${item['Cliente']||'—'}</div>
      <div class="meta">${infoTecnico(item)}${item['Endereço']||''}<br>Qtd. CEO trabalhadas: ${item['Quantidade CEO Trabalhadas']||'—'}</div>
      ${blocoDiagramasFusao(item)}
      <div class="concluido-info">✓ Concluído por ${item['Concluído Por']||'—'} em ${item['Timestamp Conclusão']||'—'}</div>
    </div>`).join('') : '<div class="empty-msg">Nenhum item concluído ainda.</div>';

  // Precisa medir depois do innerHTML já aplicado no DOM, senão as âncoras das
  // fibras ainda não existem / estão com posição zerada. Itens de dentro de
  // #listaConcluidos só medem certo se o card já estiver expandido (ver
  // toggleConcluidos) — enquanto tá fechado (display:none), o measure dá zero.
  requestAnimationFrame(() => {
    [...pendentes, ...recusados, ...concluidos].forEach(item => {
      diagramasFusao(item).forEach((d, i) => desenharLinhasFusaoGeogrid(item.rowIndex, i, d));
    });
  });
}

// Concluídos (histórico) começa fechado por padrão — tende a crescer bastante.
// Mesmo padrão de toggle já usado em index.html (Disponibilidade da Equipe).
window.toggleConcluidos = function(){
  const corpo = document.getElementById('listaConcluidos');
  const btn = document.getElementById('btnToggleConcluidos');
  const aberto = corpo.style.display !== 'none';
  corpo.style.display = aberto ? 'none' : 'block';
  btn.textContent = aberto ? '▼' : '▲';
  if(!aberto){
    // Reabrindo: os diagramas mediram zero enquanto o container estava
    // escondido — redesenha agora que o layout já é real.
    const concluidos = TODOS_ITENS.filter(i => i['Status'] === 'CONCLUIDO');
    requestAnimationFrame(() => {
      concluidos.forEach(item => {
        diagramasFusao(item).forEach((d, i) => desenharLinhasFusaoGeogrid(item.rowIndex, i, d));
      });
    });
  }
};

window.concluir = async function(rowIndex){
  const nome = (document.getElementById('inputNomeOutro').value.trim()) || document.getElementById('selNome').value;
  if(!nome){ showToast('Informe quem está concluindo antes.'); return; }
  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'CONCLUIR_GEOGRID', rowIndex, concluidoPor: nome })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao concluir.'); return; }
    showToast('Marcado como concluído no GEOGRID!');
    carregarGeogrid();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

window.toggleRecusarForm = function(rowIndex){
  const form = document.getElementById('recusa-form-'+rowIndex);
  const confirmar = document.getElementById('recusa-confirmar-'+rowIndex);
  if(!form || !confirmar) return;
  const abrindo = form.style.display === 'none';
  form.style.display = abrindo ? 'block' : 'none';
  confirmar.style.display = abrindo ? 'inline-flex' : 'none';
};

window.recusar = async function(rowIndex){
  const nome = (document.getElementById('inputNomeOutro').value.trim()) || document.getElementById('selNome').value;
  if(!nome){ showToast('Informe quem está recusando antes.'); return; }
  const motivoEl = document.getElementById('recusa-motivo-'+rowIndex);
  const motivo = motivoEl ? motivoEl.value.trim() : '';
  if(!motivo){ showToast('Escreva o motivo da recusa.'); return; }
  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'RECUSAR_GEOGRID', rowIndex, motivo, recusadoPor: nome })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao recusar.'); return; }
    showToast('Recusado — vai aparecer pro líder na Esteira de Despacho.');
    carregarGeogrid();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

let toastTimeout;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
