<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Medição · Netturbo Esteira</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root{
      --accent:#a8c93c;--accent-dark:#6b8a1f;--accent-dim:rgba(168,201,60,.08);
      --bg:#080808;--surface:#111;--surface2:#181818;--surface3:#212121;
      --border:#252525;--border-hi:#353535;
      --text:#e8e8e8;--text-dim:#888;--text-muted:#505050;
      --red:#e53935;--amber:#ffa000;--green:#8bc34a;--purple:#ab47bc;
      --radius:6px;--radius-lg:10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:15px}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:2rem}

    #login-overlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 30%,#0d1a06,#080808);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    .login-box{width:100%;max-width:360px;background:linear-gradient(160deg,#131a10,#0f0f0f);border:1px solid #1a2a12;border-radius:20px;padding:2.2rem 2rem;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
    .login-logo{width:120px;height:auto;object-fit:contain;background:#fff;border-radius:12px;padding:.6rem}
    .login-heading h2{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-align:center}
    .login-heading p{font-size:.63rem;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:.3rem;text-align:center}
    .login-field{width:100%;display:flex;flex-direction:column;gap:.3rem}
    .login-field label{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
    .login-field input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:var(--text);font-size:.92rem;padding:.7rem .9rem;width:100%}
    .login-field input:focus{outline:none;border-color:var(--accent)}
    .login-btn{width:100%;padding:.8rem;background:linear-gradient(135deg,#6b8a1f,#a8c93c);border:none;border-radius:8px;color:#050505;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .login-error{font-size:.75rem;color:var(--red);background:rgba(229,57,53,.08);border:1px solid rgba(229,57,53,.3);border-radius:6px;padding:.5rem .75rem;width:100%;text-align:center;display:none}
    .login-error.visible{display:block}

    .topbar{position:sticky;top:0;z-index:100;height:60px;background:var(--accent);display:flex;align-items:center;gap:.9rem;padding:0 1.1rem;box-shadow:0 2px 12px rgba(0,0,0,.35)}
    .topbar-menu{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0a0a0a;flex-shrink:0}
    .topbar-logo{height:32px;width:auto;background:#fff;border-radius:6px;padding:.2rem .4rem;flex-shrink:0}
    .topbar-brand{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:.06em;color:#0a0a0a;text-transform:uppercase;line-height:1.1}
    .topbar-sub{font-size:.58rem;color:#1a2a0e;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
    .topbar-spacer{flex:1}

    .page-actions{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.9rem 1.2rem 0}
    main{max-width:1400px;margin:0 auto;padding:1.3rem 1.2rem 0}

    .toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
    .toolbar input[type="month"]{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:.55rem .7rem}
    .btn{padding:.6rem 1.1rem;border:none;border-radius:var(--radius);font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-size:.82rem}
    .btn-accent{background:linear-gradient(135deg,#6b8a1f,#a8c93c);color:#050505}
    .btn-outline{background:transparent;border:1px solid var(--border-hi);color:var(--text-dim)}
    .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-green{background:linear-gradient(135deg,#5d8a1f,#8bc34a);color:#050505}
    .btn-red{background:#7a1010;color:#fff}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:1rem;overflow:hidden}
    .card-header{padding:.55rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.5rem}
    .card-body{padding:.9rem 1rem}
    .col-count{background:var(--surface3);border:1px solid var(--border-hi);border-radius:20px;padding:.15rem .55rem;font-size:.7rem;color:var(--text-dim)}

    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:.75rem}
    thead th{text-align:left;padding:.6rem .7rem;color:var(--text-muted);font-weight:600;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface2)}
    tbody td{padding:.5rem .7rem;border-bottom:1px solid var(--border)}
    tbody tr:hover{background:var(--surface2)}
    .empty-msg{padding:1.5rem;text-align:center;color:var(--text-muted);font-size:.82rem}

    .atv-card{background:var(--surface3);border:1px solid var(--border-hi);border-left:3px solid var(--purple);border-radius:var(--radius-lg);padding:.9rem 1rem;margin-bottom:.8rem}
    .protocolo{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--accent);font-size:.95rem}
    .cliente{font-size:.85rem;margin-top:.15rem}
    .meta{font-size:.72rem;color:var(--text-dim);margin-top:.4rem;line-height:1.6}
    .edit-label{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
    .acoes{display:flex;gap:.5rem}
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <img class="login-logo" src="https://netturbo.com.br/wp-content/uploads/2021/04/LOGO-1-768x230.png.webp" alt="Netturbo" onerror="this.style.display='none'"/>
    <div class="login-heading">
      <h2>Medição</h2>
      <p>LPU · Aprovação Final e Fechamento Financeiro</p>
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="pwdInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryLogin()"/>
    </div>
    <div class="login-error" id="loginErro">Senha incorreta.</div>
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
  </div>
</div>

<header class="topbar">
  <div class="topbar-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
  <img class="topbar-logo" src="https://netturbo.com.br/wp-content/uploads/2021/04/LOGO-1-768x230.png.webp" alt="Netturbo" onerror="this.style.display='none'"/>
  <div>
    <div class="topbar-brand">Medição</div>
    <div class="topbar-sub">LPU · Aprovação Final e Fechamento Financeiro</div>
  </div>
  <div class="topbar-spacer"></div>
</header>

<div class="page-actions">
  <div style="display:flex;flex-direction:column;gap:.15rem">
    <label for="selValidador" style="font-size:.58rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">Validando como</label>
    <select id="selValidador" onchange="salvarValidador()" style="background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.8rem;padding:.4rem .6rem">
      <option value="">Selecione...</option>
      <option value="Pamela Silva">Pamela Silva</option>
      <option value="Mariana Cruz">Mariana Cruz</option>
      <option value="Giselle Silva">Giselle Silva</option>
    </select>
  </div>
  <a href="dashboard_medicao.html" class="btn btn-outline" style="text-decoration:none;display:inline-flex;align-items:center">Dashboard Medição</a>
  <a href="painel.html" class="btn btn-outline" style="text-decoration:none;display:inline-flex;align-items:center">Painel</a>
</div>

<main id="app" style="display:none">

  <!-- FILA — AGUARDANDO VALIDAÇÃO MEDIÇÃO -->
  <div class="card">
    <div class="card-header">Fila — Aguardando Validação Medição<div style="flex:1"></div><span class="col-count" id="countFila">0</span></div>
    <div class="card-body">
      <div id="colFila"></div>
    </div>
  </div>

  <!-- FECHAMENTOS COM NF ANEXADA, AGUARDANDO CONFIRMAÇÃO DE PAGAMENTO (LPU Fase 2) -->
  <div class="card">
    <div class="card-header">Fechamentos Aguardando Pagamento<div style="flex:1"></div><span class="col-count" id="countPagamentos">0</span></div>
    <div class="card-body">
      <div id="colPagamentos"></div>
    </div>
  </div>

  <!-- DESCRITIVO DAS ATIVIDADES APROVADAS (o dashboard financeiro completo agora fica
       em dashboard_medicao.html) -->
  <div class="toolbar">
    <input type="month" id="mesFiltro" onchange="renderDashboard()"/>
    <button class="btn btn-outline" onclick="carregarMedicao()">↻ Atualizar</button>
    <button class="btn btn-green" onclick="exportarExcel()">Exportar Excel</button>
  </div>

  <div class="card">
    <div class="card-header">Descritivo das Atividades</div>
    <div class="card-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Prestadora</th><th>Técnico</th><th>Cliente</th><th style="text-align:right">Valor</th></tr></thead>
          <tbody id="tbodyAtividades"></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjRSTNLtZs4rUlacLcm_A_lygHYhKbFzPjs02-NCD6f00CVn7zeEDVe96poT7BYtlsVQ/exec";
const LEADERSHIP_PASSWORD = "Manutencao@101";

// A senha de acesso é compartilhada pelo time da Medição — este seletor identifica
// quem de fato está validando/confirmando cada ação, pra ficar registrado na
// planilha (Aprovador Medição / Pago Por) em vez de sempre um nome fixo.
let VALIDADOR_MEDICAO = '';

function salvarValidador(){
  VALIDADOR_MEDICAO = document.getElementById('selValidador').value;
  sessionStorage.setItem('medicao_validador', VALIDADOR_MEDICAO);
}
window.salvarValidador = salvarValidador;

function exigirValidador(){
  if(!VALIDADOR_MEDICAO){
    showToast('Selecione quem está validando (canto superior direito) antes de continuar.');
    return false;
  }
  return true;
}

let TODOS_ITENS = [];

function tryLogin(){
  const val = document.getElementById('pwdInput').value;
  if(val === LEADERSHIP_PASSWORD){
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    const hoje = new Date();
    document.getElementById('mesFiltro').value = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0');
    const validadorSalvo = sessionStorage.getItem('medicao_validador');
    if(validadorSalvo){
      VALIDADOR_MEDICAO = validadorSalvo;
      document.getElementById('selValidador').value = validadorSalvo;
    }
    carregarMedicao();
    carregarPagamentos();
    if(!window._medAutoRefresh){
      window._medAutoRefresh = setInterval(()=>{ carregarMedicao(); carregarPagamentos(); }, 30000);
    }
  }else{
    const e = document.getElementById('loginErro');
    e.classList.add('visible');
    document.getElementById('pwdInput').value = '';
    setTimeout(()=>e.classList.remove('visible'), 3000);
  }
}
window.tryLogin = tryLogin;

async function carregarMedicao(){
  try{
    const resp = await fetch(APPS_SCRIPT_URL + '?acao=LISTAR_LPU_MEDICAO');
    const result = await resp.json();
    TODOS_ITENS = result.itens || [];
    renderFila();
    renderDashboard();
  }catch(err){
    console.error(err);
  }
}
window.carregarMedicao = carregarMedicao;

// LISTAR_LPU_MEDICAO devolve um item por sub-processo LPU ativo (titular e/ou apoio,
// já separados com `tipoLpu` em cada um) — esses helpers escolhem o prefixo de coluna
// certo ('LPU ' ou 'LPU Apoio ') pra não repetir esse if em cada função abaixo.
function pfxLpu(a){ return a.tipoLpu === 'apoio' ? 'LPU Apoio ' : 'LPU '; }
function campoLpu(a, campo){ return a[pfxLpu(a) + campo]; }

// ── FILA ACIONÁVEL ────────────────────────────────────────────
function renderFila(){
  const fila = TODOS_ITENS.filter(a => {
    const statusCol = a.tipoLpu === 'apoio' ? 'Status LPU Apoio' : 'Status LPU';
    return a[statusCol] === 'AGUARDANDO_MEDICAO';
  });
  document.getElementById('countFila').textContent = fila.length;

  const col = document.getElementById('colFila');
  col.innerHTML = fila.length ? fila.map(a => {
    const empresaFallback = a.tipoLpu === 'apoio' ? a['Empresa Apoio'] : a['Empresa'];
    const tecnicoFallback = a.tipoLpu === 'apoio' ? a['Técnico Apoio'] : a['Técnico'];
    const badgeApoio = a.tipoLpu === 'apoio' ? `<span style="background:#ffa000;color:#1a1a1a;font-size:.62rem;font-weight:700;padding:.1rem .4rem;border-radius:3px;margin-left:.4rem">APOIO</span>` : '';
    const pdfBtn = campoLpu(a, 'Relatório PDF')
      ? `<a class="btn btn-outline" style="text-decoration:none;text-align:center;flex:1;padding:.4rem" href="${campoLpu(a, 'Relatório PDF')}" target="_blank">Visualizar Relatório PDF</a>`
      : `<span style="color:var(--text-muted);font-size:.72rem">Relatório PDF não disponível</span>`;

    return `<div class="atv-card">
      <div class="protocolo">${a['Protocolo O&M'] || a['Protocolo NOC'] || '—'}${badgeApoio}</div>
      <div class="cliente">${a['Cliente']||'—'}</div>
      <div class="meta">
        ${campoLpu(a,'Empresa Prestadora')||empresaFallback||''} · ${campoLpu(a,'Técnicos')||tecnicoFallback||''}<br>
        <b>Descrição Contábil:</b> ${campoLpu(a,'Descrição Contábil')||'—'}<br>
        <b>Total:</b> R$ ${Number(campoLpu(a,'Total')||0).toFixed(2)}<br>
        <b>Aprovado pelo despacho:</b> ${campoLpu(a,'Validado Por Aprovador')||'—'} em ${campoLpu(a,'Timestamp Aprovador')||'—'}<br>
        <b>Assinatura Prestador:</b> ${campoLpu(a,'Assinatura Prestador')||'—'}
      </div>
      <div style="margin-top:.5rem">${pdfBtn}</div>
      <div class="acoes" style="margin-top:.6rem">
        <button class="btn btn-green" style="flex:1" onclick="validarMedicao(${a.rowIndex}, true, '${a.tipoLpu}')">Aprovar</button>
        <button class="btn btn-red" style="flex:1" onclick="validarMedicao(${a.rowIndex}, false, '${a.tipoLpu}')">Reprovar</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-msg">Nenhuma LPU aguardando validação da Medição.</div>';
}

window.validarMedicao = async function(rowIndex, aprovado, tipoLpu){
  if(!exigirValidador()) return;
  let motivo = '';
  if(!aprovado){
    motivo = prompt('Motivo da reprovação (o técnico vai ver isso e precisa corrigir):');
    if(motivo === null) return;
    if(!motivo.trim()){ showToast('Informe o motivo da reprovação.'); return; }
  } else {
    if(!confirm('Confirma a aprovação final desta LPU? Ela vai ficar "Aprovado aguardando Nota Fiscal" e sair da tela do técnico.')) return;
  }

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'VALIDAR_LPU_MEDICAO', rowIndex, aprovado, motivo, validadoPor: VALIDADOR_MEDICAO, tipoLpu })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao validar.'); carregarMedicao(); return; }
    showToast(aprovado ? 'LPU aprovada na Medição!' : 'LPU devolvida para o técnico com o motivo.');
    carregarMedicao();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

// ── FECHAMENTOS AGUARDANDO PAGAMENTO (LPU Fase 2) ───────────────
// LISTAR_LPU_PAGAMENTO só devolve quem já tem NF anexada e ainda está
// APROVADO_AGUARDANDO_NF. Uma NF cobre um lote inteiro (titular e/ou apoio, de uma
// ou mais atividades) — como todas as linhas do lote compartilham a mesma
// 'LPU NF URL', agrupar por essa URL reconstrói o fechamento sem precisar de uma
// aba/entidade nova só pra isso.
let ITENS_PAGAMENTO = [];

async function carregarPagamentos(){
  try{
    const resp = await fetch(APPS_SCRIPT_URL + '?acao=LISTAR_LPU_PAGAMENTO');
    const result = await resp.json();
    ITENS_PAGAMENTO = result.itens || [];
    renderPagamentos();
  }catch(err){
    console.error(err);
  }
}
window.carregarPagamentos = carregarPagamentos;

function renderPagamentos(){
  const grupos = {};
  ITENS_PAGAMENTO.forEach(a => {
    const nfUrl = campoLpu(a, 'NF URL');
    if(!nfUrl) return;
    (grupos[nfUrl] = grupos[nfUrl] || []).push(a);
  });
  const chaves = Object.keys(grupos);
  document.getElementById('countPagamentos').textContent = chaves.length;

  const col = document.getElementById('colPagamentos');
  col.innerHTML = chaves.length ? chaves.map(nfUrl => {
    const itens = grupos[nfUrl];
    const primeiro = itens[0];
    const empresaFallback = primeiro.tipoLpu === 'apoio' ? primeiro['Empresa Apoio'] : primeiro['Empresa'];
    const empresa = campoLpu(primeiro,'Empresa Prestadora') || empresaFallback || 'Empresa não identificada';
    const total = itens.reduce((s,a) => s + Number(campoLpu(a,'Total')||0), 0);
    const nfUrlEscapada = nfUrl.replace(/'/g, "\\'");

    return `<div class="atv-card">
      <div class="protocolo">${empresa}</div>
      <div class="meta">
        <b>${itens.length}</b> atividade(s) neste fechamento · <b>Total:</b> ${fmtMoeda(total)}<br>
        <a href="${nfUrl}" target="_blank" style="color:var(--accent)">Ver Nota Fiscal</a> · ${campoLpu(primeiro,'Timestamp NF')||'—'}
      </div>
      <div class="acoes" style="margin-top:.6rem">
        <button class="btn btn-green" style="flex:1" onclick="confirmarPagamento('${nfUrlEscapada}')">Confirmar Pagamento</button>
        <button class="btn btn-red" style="flex:1" onclick="reprovarFechamento('${nfUrlEscapada}')">Reprovar</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty-msg">Nenhum fechamento aguardando confirmação de pagamento.</div>';
}

window.confirmarPagamento = async function(nfUrl){
  if(!exigirValidador()) return;
  if(!confirm('Confirma que o pagamento deste fechamento já saiu? Isso marca todas as atividades do lote como PAGO.')) return;

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'MARCAR_LPU_PAGO', nfUrl, pagoPor: VALIDADOR_MEDICAO })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao confirmar pagamento.'); carregarPagamentos(); return; }
    showToast(`Pagamento confirmado! ${result.atualizadas} atividade(s) marcada(s) como PAGO.`);
    carregarPagamentos();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

// Devolve o fechamento inteiro (NF errada/ilegível/valor divergente etc.) — desfaz a
// NF anexada, as atividades voltam a aparecer como "Pendente de Fechamento" em
// fechamento_lpu.html com o motivo visível, sem mexer na aprovação da Medição em si.
window.reprovarFechamento = async function(nfUrl){
  if(!exigirValidador()) return;
  const motivo = prompt('Motivo da reprovação (o prestador vai ver isso e precisa reenviar a NF):');
  if(motivo === null) return;
  if(!motivo.trim()){ showToast('Informe o motivo da reprovação.'); return; }

  try{
    const resp = await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ acao:'REPROVAR_LPU_NF', nfUrl, motivo })
    });
    const result = await resp.json();
    if(result.status !== 'ok'){ showToast(result.message||'Erro ao reprovar.'); carregarPagamentos(); return; }
    showToast(`Fechamento devolvido ao prestador. ${result.atualizadas} atividade(s) voltaram para Pendente de Fechamento.`);
    carregarPagamentos();
  }catch(err){
    console.error(err);
    showToast('Erro ao conectar com o backend.');
  }
};

// ── DESCRITIVO DAS ATIVIDADES ──────────────────────────────────
// Conta tudo que já teve LPU gerada (Total > 0) no mês de referência, titular e apoio
// juntos — independente da etapa atual (a visão financeira completa por prestadora/
// descrição contábil/semana agora fica em dashboard_medicao.html).
function renderDashboard(){
  const mes = document.getElementById('mesFiltro').value;
  const doMes = TODOS_ITENS.filter(a => {
    if(!campoLpu(a,'Total') || !campoLpu(a,'Timestamp Preenchimento')) return false;
    const ts = String(campoLpu(a,'Timestamp Preenchimento')); // "dd/mm/aaaa, HH:MM:SS"
    const dataParte = ts.split(',')[0].trim(); // "dd/mm/aaaa"
    const partes = dataParte.split('/');
    if(partes.length !== 3) return false;
    const mesAno = partes[2] + '-' + partes[1];
    return mesAno === mes;
  });

  // Tabela detalhada de atividades
  const tbAt = document.getElementById('tbodyAtividades');
  const ordenadas = [...doMes].sort((a,b) => String(campoLpu(a,'Timestamp Preenchimento')).localeCompare(String(campoLpu(b,'Timestamp Preenchimento'))));
  tbAt.innerHTML = ordenadas.length ? ordenadas.map(a => {
    const empresaFallback = a.tipoLpu === 'apoio' ? a['Empresa Apoio'] : a['Empresa'];
    const tecnicoFallback = a.tipoLpu === 'apoio' ? a['Técnico Apoio'] : a['Técnico'];
    const badgeApoio = a.tipoLpu === 'apoio' ? ' (Apoio)' : '';
    return `
    <tr>
      <td>${String(campoLpu(a,'Timestamp Preenchimento')||'').split(',')[0]}</td>
      <td>${(campoLpu(a,'Empresa Prestadora')||empresaFallback||'—') + badgeApoio}</td>
      <td>${campoLpu(a,'Técnicos')||tecnicoFallback||'—'}</td>
      <td>${a['Cliente']||'—'}</td>
      <td style="text-align:right">${fmtMoeda(Number(campoLpu(a,'Total')||0))}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" class="empty-msg">Sem LPUs geradas neste mês.</td></tr>';
}

// Exporta o Descritivo das Atividades (mesma lista da tabela, já filtrada pelo mês).
window.exportarExcel = function(){
  const mes = document.getElementById('mesFiltro').value;
  const doMes = TODOS_ITENS.filter(a => {
    if(!campoLpu(a,'Total') || !campoLpu(a,'Timestamp Preenchimento')) return false;
    const ts = String(campoLpu(a,'Timestamp Preenchimento'));
    const dataParte = ts.split(',')[0].trim();
    const partes = dataParte.split('/');
    if(partes.length !== 3) return false;
    return (partes[2] + '-' + partes[1]) === mes;
  }).sort((a,b) => String(campoLpu(a,'Timestamp Preenchimento')).localeCompare(String(campoLpu(b,'Timestamp Preenchimento'))));

  const rows = doMes.map(a => {
    const empresaFallback = a.tipoLpu === 'apoio' ? a['Empresa Apoio'] : a['Empresa'];
    const tecnicoFallback = a.tipoLpu === 'apoio' ? a['Técnico Apoio'] : a['Técnico'];
    return {
      'Data': String(campoLpu(a,'Timestamp Preenchimento')||'').split(',')[0],
      'Prestadora': (campoLpu(a,'Empresa Prestadora')||empresaFallback||'') + (a.tipoLpu==='apoio' ? ' (Apoio)' : ''),
      'Técnico': campoLpu(a,'Técnicos')||tecnicoFallback||'',
      'Cliente': a['Cliente']||'',
      'Descrição Contábil': campoLpu(a,'Descrição Contábil')||'',
      'Status': (a[a.tipoLpu==='apoio' ? 'Status LPU Apoio' : 'Status LPU'])||'',
      'Valor': Number(campoLpu(a,'Total')||0)
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Descritivo');
  XLSX.writeFile(wb, `Medicao_Descritivo_${mes || 'geral'}.xlsx`);
};

function fmtMoeda(v){
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent-dark);border-radius:30px;padding:.6rem 1.2rem;font-size:.78rem;color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:999;white-space:nowrap';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 3200);
}
</script>
