<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Treinamento · Netturbo Esteira</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="auth.js"></script>
<style>
:root{
  --accent:#a8c93c;--accent-dark:#6b8a1f;--accent-dim:rgba(168,201,60,.08);
  --bg:#080808;--surface:#111;--surface2:#181818;--surface3:#212121;
  --border:#252525;--border-hi:#353535;
  --text:#e8e8e8;--text-dim:#888;--text-muted:#505050;
  --red:#e53935;--amber:#ffa000;--green:#8bc34a;
  --radius:6px;--radius-lg:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:3rem}

.topbar{position:sticky;top:0;z-index:100;height:60px;background:var(--accent);display:flex;align-items:center;gap:.9rem;padding:0 1.1rem;box-shadow:0 2px 12px rgba(0,0,0,.35);margin:-1.5rem -1rem 1.5rem -1rem}
.topbar-menu{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0a0a0a;flex-shrink:0}
.topbar-logo{height:32px;width:auto;background:#fff;border-radius:6px;padding:.2rem .4rem;flex-shrink:0}
.topbar-brand{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:.02em;color:#0a0a0a;text-transform:uppercase;line-height:1.1;display:inline-block;transform:skewX(-8deg)}
.topbar-sub{font-size:.58rem;color:#1a2a0e;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.topbar-spacer{flex:1}

.page-actions{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:0 1rem .9rem}
main{max-width:700px;margin:0 auto;padding:0 1rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.9rem;overflow:hidden}
.card-header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border)}
.card-header h2{font-family:'Rajdhani',sans-serif;font-size:.83rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card-body{padding:.9rem 1rem}
.card-body>*+*{margin-top:.7rem}

.field{display:flex;flex-direction:column;gap:.28rem}
.field label{font-size:.67rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.field input,.field select,.field textarea{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:.875rem;padding:.52rem .75rem;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.divider{height:1px;background:var(--border);margin:.72rem 0}

.participante-row{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius-lg);padding:.7rem .75rem;margin-bottom:.7rem}
.part-top{display:flex;gap:.5rem;align-items:flex-start}
.part-top input{background:var(--surface2);border:1px solid var(--border-hi);border-radius:var(--radius);color:var(--text);font-size:.85rem;padding:.5rem .65rem}
.part-nome{flex:1.6}
.part-setor{flex:1}
.btn-del-part{width:32px;height:32px;flex-shrink:0;border-radius:var(--radius);background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.3);color:var(--red);font-size:.8rem;cursor:pointer}
.part-label-sig{font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:.55rem 0 .3rem}

.sig-wrap{position:relative;background:var(--surface2);border:1px solid var(--border-hi);border-radius:var(--radius);overflow:hidden}
.sig-canvas{width:100%;height:90px;cursor:crosshair;touch-action:none;display:block}
.sig-clear{position:absolute;top:.35rem;right:.35rem;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.3);color:var(--red);font-size:.62rem;padding:.18rem .45rem;border-radius:4px;cursor:pointer;font-weight:600}

.btn-add-part{width:100%;padding:.65rem;background:transparent;border:1px dashed var(--border-hi);border-radius:var(--radius-lg);color:var(--text-dim);font-size:.8rem;cursor:pointer;letter-spacing:.05em}
.btn-add-part:hover{border-color:var(--accent);color:var(--accent)}

#fotosBloqueio{padding:1rem;text-align:center;color:var(--text-muted);font-size:.78rem;font-style:italic}
#fotos-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:.5rem}
@media(max-width:400px){#fotos-grid{grid-template-columns:1fr}}
.foto-card{background:var(--surface3);border:1px solid var(--border-hi);border-radius:var(--radius-lg);overflow:hidden;position:relative}
.foto-card .foto-preview{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer}
.foto-card .foto-caption{padding:.5rem .6rem;display:flex;gap:.4rem;align-items:center}
.foto-card .foto-caption input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border-hi);color:var(--text);font-size:.78rem;padding:.2rem .1rem;font-family:'Inter',sans-serif}
.foto-card .foto-caption input:focus{outline:none;border-color:var(--accent)}
.foto-card .btn-del-foto{width:24px;height:24px;border-radius:4px;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.3);color:var(--red);font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.foto-card .foto-index{position:absolute;top:.4rem;left:.4rem;background:rgba(0,0,0,.7);border:1px solid rgba(168,201,60,.4);color:var(--accent);font-size:.6rem;font-weight:700;letter-spacing:.08em;padding:.15rem .45rem;border-radius:4px;font-family:'Rajdhani',sans-serif}
.btn-add-foto{margin-top:.6rem;width:100%;padding:.6rem;background:transparent;border:1px dashed var(--border-hi);border-radius:var(--radius-lg);color:var(--text-dim);font-size:.78rem;cursor:pointer}
.btn-add-foto:hover{border-color:var(--accent);color:var(--accent)}
#foto-input{display:none}

.btn-row{margin-top:1rem}
.btn-action{width:100%;padding:.85rem;border:none;border-radius:var(--radius-lg);font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,#6b8a1f,#a8c93c);color:#050505}
.btn-action:active{opacity:.85}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--accent-dark);border-radius:30px;padding:.6rem 1.2rem;font-size:.78rem;color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#pdf-root{position:fixed;left:-99999px;top:0;z-index:-1;background:#fff}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
  <img class="topbar-logo" id="topbarLogo" alt="Netturbo"/>
  <div>
    <div class="topbar-brand">SIGONET</div>
    <div class="topbar-sub">Treinamento · Lista de Presença</div>
  </div>
  <div class="topbar-spacer"></div>
</header>

<div class="page-actions">
  <a href="painel.html" class="btn-add-part" style="width:auto;text-decoration:none;display:inline-flex;align-items:center;padding:.5rem 1rem">Painel</a>
</div>

<main id="app">

  <section class="card">
    <div class="card-header"><h2>Identificação</h2></div>
    <div class="card-body">
      <div class="field"><label>Tema / Título do Treinamento</label><input type="text" id="campoTema" placeholder="Ex: Uso correto do OTDR"/></div>
      <div class="grid2">
        <div class="field"><label>Tipo</label>
          <select id="campoTipo">
            <option value="Treinamento">Treinamento</option>
            <option value="Alinhamento de Processo">Alinhamento de Processo</option>
          </select>
        </div>
        <div class="field"><label>Data</label><input type="date" id="campoData"/></div>
        <div class="field"><label>Horário Início</label><input type="time" id="campoHoraInicio"/></div>
        <div class="field"><label>Horário Fim</label><input type="time" id="campoHoraFim"/></div>
        <div class="field"><label>Local do Treinamento</label><input type="text" id="campoLocal" placeholder="Ex: Sede Netturbo - Sumaré/SP"/></div>
        <div class="field"><label>Ministrado por</label><input type="text" id="campoMinistrante" placeholder="Nome de quem ministrou"/></div>
      </div>
      <div class="field"><label>Objetivo / Tema Abordado</label><textarea id="campoObjetivo" placeholder="Descreva o objetivo e o conteúdo abordado..."></textarea></div>
    </div>
  </section>

  <section class="card">
    <div class="card-header"><h2>Participantes</h2></div>
    <div class="card-body">
      <div style="font-size:.72rem;color:var(--text-muted)">Preencha o nome e colete a assinatura de cada participante direto no celular.</div>
      <div id="listaParticipantes"></div>
      <button class="btn-add-part" onclick="adicionarParticipante()">+ Adicionar Participante</button>
    </div>
  </section>

  <section class="card">
    <div class="card-header"><h2>Registro Fotográfico</h2></div>
    <div class="card-body">
      <div id="fotosBloqueio">Colete ao menos uma assinatura de participante para liberar o anexo de fotos.</div>
      <div id="fotosConteudo" style="display:none">
        <div id="fotos-grid"></div>
        <button class="btn-add-foto" onclick="document.getElementById('foto-input').click()">Adicionar Foto(s)</button>
        <input type="file" id="foto-input" accept="image/*" multiple onchange="adicionarFotos(this)"/>
      </div>
    </div>
  </section>

  <div class="btn-row">
    <button class="btn-action" onclick="gerarPDF()">Gerar PDF</button>
  </div>

</main>
<div id="toast"></div>
<div id="pdf-root"></div>

// ── PARTICIPANTES ────────────────────────────────────────
let PARTICIPANTE_SEQ = 0;

function templateParticipante(n){
  return `
  <div class="participante-row" id="part-${n}" data-seq="${n}">
    <div class="part-top">
      <input type="text" class="part-nome" id="nome-${n}" placeholder="Nome completo"/>
      <input type="text" class="part-setor" id="setor-${n}" placeholder="Setor"/>
      <button type="button" class="btn-del-part" onclick="removerParticipante(${n})">✕</button>
    </div>
    <div class="part-label-sig">Assinatura</div>
    <div class="sig-wrap">
      <canvas class="sig-canvas" id="sig-${n}"></canvas>
      <button type="button" class="sig-clear" onclick="limparAssinatura('sig-${n}')">Limpar</button>
    </div>
  </div>`;
}

window.adicionarParticipante = function(){
  const n = ++PARTICIPANTE_SEQ;
  document.getElementById('listaParticipantes').insertAdjacentHTML('beforeend', templateParticipante(n));
  initCanvas('sig-'+n);
};

window.removerParticipante = function(n){
  const el = document.getElementById('part-'+n);
  if(el) el.remove();
  atualizarHabilitacaoFotos();
};

// ── ASSINATURA (mesmo padrão de fiscal_v2.html/jornada_excedente.html) ──
function initCanvas(id){
  const canvas=document.getElementById(id);
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||600;canvas.height=90;
  ctx.strokeStyle='#a8c93c';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,last={x:0,y:0};
  const getPos=e=>{const r=canvas.getBoundingClientRect();if(e.touches){return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top};}return{x:e.clientX-r.left,y:e.clientY-r.top};};
  canvas.addEventListener('mousedown',e=>{drawing=true;last=getPos(e);});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;last=getPos(e);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}
window.limparAssinatura = function(id){
  const c=document.getElementById(id);
  c.getContext('2d').clearRect(0,0,c.width,c.height);
  atualizarHabilitacaoFotos();
};
function isSigEmpty(id){
  const c=document.getElementById(id);
  return !c.getContext('2d').getImageData(0,0,c.width,c.height).data.some(x=>x!==0);
}

// Libera o bloco de fotos assim que existir 1 participante com nome + assinatura.
// Delegação de eventos no container (input dos nomes, mouseup/touchend do canvas
// borbulham até aqui) — não precisa reatribuir listener a cada linha nova.
function atualizarHabilitacaoFotos(){
  const habilitado = Array.from(document.querySelectorAll('.participante-row')).some(row=>{
    const seq = row.dataset.seq;
    const nome = document.getElementById('nome-'+seq).value.trim();
    return nome && !isSigEmpty('sig-'+seq);
  });
  document.getElementById('fotosBloqueio').style.display = habilitado ? 'none' : 'block';
  document.getElementById('fotosConteudo').style.display = habilitado ? 'block' : 'none';
}
document.getElementById('listaParticipantes').addEventListener('input', atualizarHabilitacaoFotos);
document.getElementById('listaParticipantes').addEventListener('mouseup', atualizarHabilitacaoFotos);
document.getElementById('listaParticipantes').addEventListener('touchend', atualizarHabilitacaoFotos);

// ── FOTOS (com compressão — mesmo helper de manutencao_preventiva.html;
// sem isso, foto de celular vira base64 de vários MB e trava o html2canvas) ──
function compressImage(file,maxSize,quality){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxSize||h>maxSize){const ratio=Math.min(maxSize/w,maxSize/h);w=Math.round(w*ratio);h=Math.round(h*ratio);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let fotosTreinamento = [];
function renderFotos(){
  const grid = document.getElementById('fotos-grid');
  grid.innerHTML = '';
  fotosTreinamento.forEach((foto,idx) => {
    const card = document.createElement('div');
    card.className = 'foto-card';
    card.innerHTML = `
      <span class="foto-index">FOTO ${idx+1}</span>
      <img class="foto-preview" src="${foto.src}" onclick="verFoto('${foto.src}')"/>
      <div class="foto-caption">
        <input type="text" placeholder="Legenda..." value="${foto.caption||''}" oninput="fotosTreinamento[${idx}].caption=this.value"/>
        <button class="btn-del-foto" onclick="removerFoto(${idx})">✕</button>
      </div>`;
    grid.appendChild(card);
  });
}
window.adicionarFotos = async function(input){
  const files = [...input.files];
  if(!files.length) return;
  for(const file of files){
    const dataUrl = await compressImage(file, 1200, 0.82);
    fotosTreinamento.push({src:dataUrl, caption:''});
  }
  renderFotos();
  showToast(`${files.length} foto(s) adicionada(s)`);
  input.value = '';
};
window.removerFoto = function(idx){ fotosTreinamento.splice(idx,1); renderFotos(); };
window.verFoto = function(src){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9998;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  const img=document.createElement('img');
  img.src=src;img.style.cssText='max-width:95vw;max-height:90vh;border-radius:8px;object-fit:contain';
  ov.appendChild(img);ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
};

// ── PDF ───────────────────────────────────────────────────
const PDF_W = 794;
function v(id){ return document.getElementById(id).value.trim(); }
function fmtDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
}

function coletarParticipantes(){
  return Array.from(document.querySelectorAll('.participante-row')).map(row=>{
    const seq = row.dataset.seq;
    const nome = document.getElementById('nome-'+seq).value.trim();
    const setor = document.getElementById('setor-'+seq).value.trim();
    const sig = isSigEmpty('sig-'+seq) ? '' : document.getElementById('sig-'+seq).toDataURL('image/png');
    return { nome, setor, sig };
  }).filter(p => p.nome);
}

function linhaParticipante(p, idx){
  return `<tr>
    <td style="padding:6px 8px;border:1px solid #ddd;font-size:10px;color:#333;text-align:center;width:26px">${idx+1}</td>
    <td style="padding:6px 8px;border:1px solid #ddd;font-size:10px;color:#333">${p.nome}</td>
    <td style="padding:6px 8px;border:1px solid #ddd;font-size:9px;color:#555">${p.setor||'—'}</td>
    <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;width:150px">${p.sig?`<img src="${p.sig}" style="max-height:34px;max-width:140px;object-fit:contain"/>`:''}</td>
  </tr>`;
}

function cabecalhoMini(tema){
  return `
  <div style="display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:2px solid #8bc34a;margin-bottom:20px">
    <div style="width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid #8bc34a;flex-shrink:0;background:#fff">
      <img src="${LOGO_B64}" style="width:100%;height:100%;object-fit:contain;display:block"/>
    </div>
    <div>
      <div style="font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#555">NETTURBO · LISTA DE PRESENÇA</div>
      <div style="font-size:12px;font-weight:700;color:#333">${tema||'Treinamento'}</div>
    </div>
  </div>`;
}

function rodape(){
  return `<div style="position:absolute;bottom:28px;left:55px;right:55px;display:flex;justify-content:space-between;font-size:8px;color:#bbb;border-top:1px solid #eee;padding-top:8px">
    <span>Netturbo · Lista de Presença</span>
    <span>Gerado em ${new Date().toLocaleString('pt-BR')}</span>
  </div>`;
}

function buildPDFHtml(){
  const tema = v('campoTema') || 'Treinamento';
  const tipo = v('campoTipo');
  const dataFormatada = fmtDate(v('campoData'));
  const participantes = coletarParticipantes();

  const PRIMEIRA_PAGINA_MAX = 14;
  const OUTRAS_PAGINAS_MAX = 26;
  const pg1Participantes = participantes.slice(0, PRIMEIRA_PAGINA_MAX);
  const restante = participantes.slice(PRIMEIRA_PAGINA_MAX);

  const pg1 = `
  <div style="width:${PDF_W}px;min-height:1122px;padding:55px 55px 50px;position:relative;background:#fff;font-family:Arial,sans-serif;color:#111">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:18px;border-bottom:4px solid #8bc34a;margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:18px">
        <div style="width:66px;height:66px;border-radius:50%;overflow:hidden;border:2px solid #8bc34a;flex-shrink:0;background:#fff">
          <img src="${LOGO_B64}" style="width:100%;height:100%;object-fit:contain;display:block"/>
        </div>
        <div>
          <div style="font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#555;margin-bottom:6px">NETTURBO</div>
          <div style="font-size:26px;font-weight:700;color:#111;line-height:1.1">Lista de Presença</div>
          <div style="font-size:12px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-top:5px">${tipo}</div>
        </div>
      </div>
      <div style="text-align:right;font-size:11px;color:#666;line-height:1.8;padding-top:4px">
        ${dataFormatada}<br/>
        ${v('campoHoraInicio')||'—'} às ${v('campoHoraFim')||'—'}
      </div>
    </div>

    <div style="margin-bottom:20px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 28px">
        <div><div style="font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px">TEMA / TÍTULO</div><div style="font-size:11px;color:#111;border-bottom:1px solid #eee;padding-bottom:3px">${tema}</div></div>
        <div><div style="font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px">LOCAL</div><div style="font-size:11px;color:#111;border-bottom:1px solid #eee;padding-bottom:3px">${v('campoLocal')||'—'}</div></div>
        <div><div style="font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px">MINISTRADO POR</div><div style="font-size:11px;color:#111;border-bottom:1px solid #eee;padding-bottom:3px">${v('campoMinistrante')||'—'}</div></div>
        <div><div style="font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px">PARTICIPANTES</div><div style="font-size:11px;color:#111;border-bottom:1px solid #eee;padding-bottom:3px">${participantes.length}</div></div>
      </div>
      <div style="margin-top:10px"><div style="font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px">OBJETIVO</div><div style="font-size:11px;color:#111;border-bottom:1px solid #eee;padding-bottom:5px;white-space:pre-wrap">${v('campoObjetivo')||'—'}</div></div>
    </div>

    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr>
          <th style="background:#f5f5f5;padding:6px 8px;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Nº</th>
          <th style="background:#f5f5f5;padding:6px 8px;text-align:left;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Nome Completo</th>
          <th style="background:#f5f5f5;padding:6px 8px;text-align:left;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Setor</th>
          <th style="background:#f5f5f5;padding:6px 8px;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Assinatura</th>
        </tr>
      </thead>
      <tbody>${pg1Participantes.map(linhaParticipante).join('')}</tbody>
    </table>
    ${rodape()}
  </div>`;

  let pgsParticipantesExtra = '';
  for(let i=0;i<restante.length;i+=OUTRAS_PAGINAS_MAX){
    const chunk = restante.slice(i, i+OUTRAS_PAGINAS_MAX);
    pgsParticipantesExtra += `
    <div style="width:${PDF_W}px;min-height:1122px;padding:55px 55px 50px;position:relative;background:#fff;font-family:Arial,sans-serif;color:#111">
      ${cabecalhoMini(tema)}
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr>
            <th style="background:#f5f5f5;padding:6px 8px;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Nº</th>
            <th style="background:#f5f5f5;padding:6px 8px;text-align:left;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Nome Completo</th>
            <th style="background:#f5f5f5;padding:6px 8px;text-align:left;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Setor</th>
            <th style="background:#f5f5f5;padding:6px 8px;border:1px solid #ddd;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:#666">Assinatura</th>
          </tr>
        </thead>
        <tbody>${chunk.map((p,ci)=>linhaParticipante(p, PRIMEIRA_PAGINA_MAX+i+ci)).join('')}</tbody>
      </table>
      ${rodape()}
    </div>`;
  }

  let pgsFotos = '';
  for(let i=0;i<fotosTreinamento.length;i+=4){
    const chunk = fotosTreinamento.slice(i, i+4);
    pgsFotos += `
    <div style="width:${PDF_W}px;min-height:1122px;padding:55px 55px 50px;position:relative;background:#fff;font-family:Arial,sans-serif;color:#111">
      ${cabecalhoMini(tema)}
      <div style="font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#8bc34a;margin-bottom:14px">REGISTRO FOTOGRÁFICO${fotosTreinamento.length>4?' (continuação)':''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        ${chunk.map((f,ci)=>`
          <div>
            <div style="font-size:8px;font-weight:700;letter-spacing:2px;color:#8bc34a;margin-bottom:6px;text-transform:uppercase">FOTO ${i+ci+1}</div>
            <img src="${f.src}" style="width:100%;height:220px;object-fit:cover;border-radius:5px;border:1px solid #ddd;display:block"/>
            <div style="font-size:10px;color:#555;margin-top:6px;font-style:italic;text-align:center;padding:0 4px">${f.caption||'(sem legenda)'}</div>
          </div>`).join('')}
      </div>
      ${rodape()}
    </div>`;
  }

  return pg1 + pgsParticipantesExtra + pgsFotos;
}

window.gerarPDF = async function(){
  if(!v('campoTema')){ showToast('Preencha o tema do treinamento.'); return; }
  if(!v('campoLocal')){ showToast('Preencha o local do treinamento.'); return; }
  if(!v('campoMinistrante')){ showToast('Preencha quem ministrou.'); return; }
  if(!coletarParticipantes().length){ showToast('Adicione ao menos um participante com nome.'); return; }

  showToast('⏳ Preparando PDF...');
  await new Promise(r=>setTimeout(r,100));

  const container = document.getElementById('pdf-root');
  container.style.cssText = `position:fixed;left:-99999px;top:0;z-index:-1;background:#fff;width:${PDF_W}px`;
  container.innerHTML = buildPDFHtml();

  const allImgs = [...container.querySelectorAll('img')];
  await new Promise(resolve=>{
    if(!allImgs.length){ resolve(); return; }
    let done=0;
    const check=()=>{ done++; if(done>=allImgs.length) resolve(); };
    allImgs.forEach(img=>{
      if(img.complete && img.naturalHeight>0){ check(); }
      else{ img.onload=check; img.onerror=check; }
    });
    setTimeout(resolve, 5000);
  });
  await new Promise(r=>setTimeout(r,300));

  try{
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait',unit:'pt',format:'a4',compress:true});
    const pages = container.querySelectorAll("div[style*='min-height:1122px']");
    for(let i=0;i<pages.length;i++){
      if(i>0) doc.addPage();
      const canvas = await html2canvas(pages[i], { scale:2, useCORS:true, allowTaint:true, logging:false, backgroundColor:'#ffffff', width:PDF_W, windowWidth:PDF_W });
      doc.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, 595.28, 841.89);
    }
    const temaArquivo = (v('campoTema')||'treinamento').replace(/\s+/g,'-');
    const dataStr = v('campoData') || new Date().toISOString().split('T')[0];
    doc.save(`Lista-Presenca-${temaArquivo}-${dataStr}.pdf`);
    showToast('PDF gerado com sucesso!');
  }catch(err){
    console.error(err);
    showToast('Erro ao gerar PDF. Veja o console.');
  }
  container.innerHTML = '';
};

// ── TOAST ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
}

// ── INIT ──────────────────────────────────────────────────
function iniciarApp(){
  document.getElementById('campoData').value = new Date().toISOString().split('T')[0];
  const usuario = NetturboAuth.usuario();
  if(usuario) document.getElementById('campoMinistrante').value = usuario.nome;
  adicionarParticipante();
}

NetturboAuth.proteger({ tela:'Treinamento / Alinhamento', aoEntrar: iniciarApp });
</script>
